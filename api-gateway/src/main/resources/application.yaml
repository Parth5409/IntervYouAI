server:
  port: 8080

spring:
  application:
    name: intervyouai-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: ai_engine
            uri: ${AI_ENGINE_URL:http://localhost:${AI_ENGINE_PORT:8000}/}
            predicates:
              - Path=/api/engine/**
            filters:
              - AddRequestHeader=Host, localhost:8000
          - id: backend_core
            uri: ${CORE_BACKEND_URL:http://localhost:${CORE_BACKEND_PORT:8081}/}
            predicates:
              - Path=/api/core/**